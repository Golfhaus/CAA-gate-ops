<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coastal American Airways — Gate Utilization</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:   #0b2e4a;
    --navy:        #0f4c81;
    --navy-light:  #2f6fa8;
    --coral:       #e6741e;
    --coral-dark:  #c25e12;
    --cream:       #f6f2e9;
    --paper:       #fffdf8;
    --ink:         #1c2530;
    --ink-soft:    #5c6b78;
    --line:        #d9d2c1;
    --warn:        #b23a3a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}

  header{background:linear-gradient(180deg,var(--navy-deep),var(--navy) 140%);padding:22px 20px 26px;color:var(--paper);box-shadow:0 3px 0 var(--coral);}
  .header-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;}
  .logo-wrap{background:var(--paper);border-radius:8px;padding:8px 12px;flex-shrink:0;}
  .logo-wrap img{display:block;height:34px;width:auto;}
  .brand-text .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin:0 0 2px;}
  .brand-text h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase;}
  .header-note{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#c9d8e6;text-align:right;line-height:1.5;}

  .controls{max-width:1180px;margin:-16px auto 0;padding:0 20px;}
  .controls-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;box-shadow:0 6px 18px rgba(11,46,74,.10);align-items:end;}
  @media (max-width:800px){.controls-card{grid-template-columns:1fr 1fr;}}
  @media (max-width:480px){.controls-card{grid-template-columns:1fr;}}
  .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;}
  .field select,.field input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);}
  .field select:focus,.field input:focus{outline:2px solid var(--navy-light);outline-offset:1px;}

  main{max-width:1180px;margin:0 auto;padding:18px 20px 60px;}

  .city-header{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;margin:6px 2px 10px;}
  .city-header h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;margin:0;color:var(--navy-deep);}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink-soft);}
  .badge.hub{background:var(--navy);color:var(--paper);border-color:var(--navy);}
  .badge.focus{background:var(--coral);color:var(--paper);border-color:var(--coral);}
  .badge.warn{background:var(--warn);color:var(--paper);border-color:var(--warn);}
  .badge.ok{background:#eef4ee;color:#3a6b4a;border-color:#c3dbc7;}

  .legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:0 2px 12px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;user-select:none;padding:3px 8px;border-radius:6px;border:1px solid transparent;}
  .legend-item:hover{border-color:var(--line);}
  .legend-item.off{opacity:.35;}
  .swatch{width:13px;height:13px;border-radius:3px;flex-shrink:0;}

  .zoom-toolbar{display:flex;gap:6px;align-items:center;margin:0 2px 10px;}
  .zoom-toolbar button{font-family:'IBM Plex Mono',monospace;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer;color:var(--navy-deep);}
  .zoom-toolbar button:hover{background:var(--cream);}
  .zoom-toolbar .hint{font-size:11.5px;color:var(--ink-soft);margin-left:6px;}

  .chart-frame{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(11,46,74,.08);overflow:hidden;}
  .chart-body{display:flex;}
  .chart-labels{flex-shrink:0;position:sticky;left:0;z-index:2;background:var(--paper);border-right:1px solid var(--line);}
  .chart-labels svg{display:block;}
  .chart-scroll{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;cursor:grab;touch-action:pan-x;position:relative;}
  .chart-scroll.grabbing{cursor:grabbing;}
  .chart-scroll svg{display:block;}

  .claim-rect{stroke:#fff;stroke-width:1.4;cursor:pointer;}
  .claim-rect:hover{stroke:var(--navy-deep);stroke-width:2.4;}
  .claim-label{font-family:'IBM Plex Mono',monospace;font-weight:600;text-anchor:middle;dominant-baseline:middle;fill:#1a1a1a;pointer-events:none;}
  .claim-corner{font-family:'IBM Plex Mono',monospace;font-weight:600;fill:#2a2a2a;pointer-events:none;}
  .row-line{stroke:var(--line);stroke-width:1;}
  .row-label{font-family:'Inter',sans-serif;fill:var(--ink-soft);dominant-baseline:middle;}
  .divider{stroke:var(--ink);stroke-width:1.6;}
  .tick-label{font-family:'IBM Plex Mono',monospace;fill:var(--ink-soft);text-anchor:middle;}
  .grid-line{stroke:var(--line);stroke-width:0.6;opacity:.6;}

  .tooltip{position:fixed;z-index:50;background:var(--navy-deep);color:var(--paper);padding:9px 12px;border-radius:7px;font-size:12.5px;line-height:1.5;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:240px;display:none;}
  .tooltip b{color:var(--coral);}
  .tooltip .tt-close{display:none;}

  .empty,.loading{padding:60px 20px;text-align:center;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  footer{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:var(--ink-soft);font-size:11.5px;font-family:'IBM Plex Mono',monospace;}
  .demo-flag{display:inline-block;background:#fdecec;color:var(--warn);border:1px solid #f0c3c3;padding:2px 8px;border-radius:5px;margin-right:6px;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-wrap"><img src="coastal_logo.png" alt="Coastal American Airways"></div>
    <div class="brand-text">
      <p class="eyebrow">Gate Ops</p>
      <h1>Gate &amp; Stand Utilization</h1>
    </div>
    <div class="header-note" id="scheduleNote"></div>
  </div>
</header>

<div class="controls">
  <div class="controls-card">
    <div class="field">
      <label for="scheduleSelect">Schedule</label>
      <select id="scheduleSelect"></select>
    </div>
    <div class="field">
      <label for="citySelect">City</label>
      <select id="citySelect"></select>
    </div>
    <div class="field" style="grid-column:span 2;">
      <label for="citySearch">Find a city (any of the 105, not just hubs)</label>
      <input id="citySearch" type="text" placeholder="Type a code or name, e.g. &quot;ILM&quot; or &quot;Wilmington&quot;">
    </div>
  </div>
</div>

<main>
  <div class="city-header" id="cityHeader"></div>
  <div class="legend" id="fleetLegend"></div>
  <div class="zoom-toolbar">
    <button id="zoomOut" title="Zoom out">−</button>
    <button id="zoomReset" title="Reset zoom">100%</button>
    <button id="zoomIn" title="Zoom in">+</button>
    <span class="hint">Drag to pan · tap a block for details</span>
  </div>
  <div class="chart-frame">
    <div class="chart-body" id="chartBody">
      <div class="chart-labels" id="chartLabels"></div>
      <div class="chart-scroll" id="chartScroll">
        <div class="loading">Loading…</div>
      </div>
    </div>
  </div>
  <div class="tooltip" id="tooltip"></div>
</main>

<footer id="footerNote"></footer>

<script>
const ROW_H = 40;         // viewBox units per gate/stand row
const AXIS_H = 34;        // top strip for hour ticks
const MINUTES = 1440;     // minutes in the 03:00-03:00 window
const CHART_MARGIN = 20;  // small viewBox-unit margin each side of the timeline, just so the first/last hour tick's label isn't clipped
const LABEL_W = 84;       // viewBox units for the frozen gate/stand label column

let manifest = [], currentSchedule = null, currentCity = null;
let scale = 1;             // 1 == fit the full day to the visible width; >1 zooms in
const MIN_SCALE = 0.5, MAX_SCALE = 8;
let hiddenFleets = new Set();

const els = {
  scheduleSelect: document.getElementById('scheduleSelect'),
  citySelect: document.getElementById('citySelect'),
  citySearch: document.getElementById('citySearch'),
  cityHeader: document.getElementById('cityHeader'),
  fleetLegend: document.getElementById('fleetLegend'),
  chartBody: document.getElementById('chartBody'),
  chartLabels: document.getElementById('chartLabels'),
  chartScroll: document.getElementById('chartScroll'),
  tooltip: document.getElementById('tooltip'),
  scheduleNote: document.getElementById('scheduleNote'),
  footerNote: document.getElementById('footerNote'),
  zoomIn: document.getElementById('zoomIn'),
  zoomOut: document.getElementById('zoomOut'),
  zoomReset: document.getElementById('zoomReset'),
};

async function init() {
  try {
    manifest = await (await fetch('data/gate_manifest.json')).json();
  } catch (e) {
    els.chartScroll.innerHTML = '<div class="empty">Could not load data/gate_manifest.json</div>';
    return;
  }
  els.scheduleSelect.innerHTML = manifest.map((m,i) =>
    `<option value="${i}">${escapeHtml(m.label)}</option>`).join('');
  els.scheduleSelect.addEventListener('change', () => loadSchedule(+els.scheduleSelect.value));
  els.citySelect.addEventListener('change', () => selectCity(els.citySelect.value));
  els.citySearch.addEventListener('input', filterCityOptions);
  els.zoomIn.addEventListener('click', () => setZoom(scale * 1.35));
  els.zoomOut.addEventListener('click', () => setZoom(scale / 1.35));
  els.zoomReset.addEventListener('click', () => setZoom(1));
  let resizeTimer;
  window.addEventListener('resize', () => {
    // fit-to-width depends on the live container width, so re-render (debounced) on resize
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (currentCity) renderChart(currentCity); }, 120);
  });
  await loadSchedule(0);
}

async function loadSchedule(idx) {
  const entry = manifest[idx];
  if (!entry) return;
  currentSchedule = await (await fetch('data/' + entry.file)).json();
  els.scheduleNote.textContent = currentSchedule.label || entry.label;

  const sorted = [...currentSchedule.cities].sort((a,b) => a.code.localeCompare(b.code));
  els.citySelect.innerHTML = sorted.map(c =>
    `<option value="${c.code}">${c.code} — ${escapeHtml(c.name)}${c.isHub ? ' (Hub)' : c.isFocusCity ? ' (Focus City)' : ''}</option>`
  ).join('');

  const isDemo = /demo|synthetic/i.test(currentSchedule.label || '');
  els.footerNote.innerHTML = isDemo
    ? '<span class="demo-flag">DEMO DATA</span>Synthetic sample schedule for prototyping this renderer — not a real Coastal American schedule.'
    : 'Coastal American Airways — internal gate/stand planning tool.';

  const startCode = sorted.find(c => c.isHub)?.code || sorted[0]?.code;
  selectCity(startCode);
}

function filterCityOptions() {
  const q = els.citySearch.value.trim().toLowerCase();
  const sorted = [...currentSchedule.cities].sort((a,b) => a.code.localeCompare(b.code));
  const filtered = q ? sorted.filter(c => c.code.toLowerCase().includes(q) || c.name.toLowerCase().includes(q)) : sorted;
  els.citySelect.innerHTML = filtered.map(c =>
    `<option value="${c.code}">${c.code} — ${escapeHtml(c.name)}${c.isHub ? ' (Hub)' : c.isFocusCity ? ' (Focus City)' : ''}</option>`
  ).join('');
  if (filtered.length) selectCity(filtered[0].code);
}

function selectCity(code) {
  const city = currentSchedule.cities.find(c => c.code === code);
  if (!city) { els.chartScroll.innerHTML = '<div class="empty">No data for that city in this schedule.</div>'; return; }
  currentCity = city;
  els.citySelect.value = code;
  renderCityHeader(city);
  renderLegend();
  renderChart(city);
}

function renderCityHeader(city) {
  const total = city.nGates + city.nStands;
  const overCap = city.peakUsed > city.nGates;
  els.cityHeader.innerHTML = `
    <h2>${escapeHtml(city.name)} <span style="color:var(--ink-soft);font-weight:400;">(${city.code})</span></h2>
    ${city.isHub ? '<span class="badge hub">Hub</span>' : ''}
    ${city.isFocusCity ? '<span class="badge focus">Focus City</span>' : ''}
    <span class="badge">${city.nGates} gates · ${city.nStands} stands</span>
    <span class="badge ${overCap ? 'warn' : 'ok'}">Peak ${city.peakUsed} of ${city.nGates}${overCap ? ` — ${city.peakUsed - city.nGates} onto stands` : ''}</span>
  `;
}

function renderLegend() {
  const colors = currentSchedule.fleetColors;
  els.fleetLegend.innerHTML = Object.entries(colors).map(([fleet,color]) => `
    <div class="legend-item ${hiddenFleets.has(fleet) ? 'off' : ''}" data-fleet="${fleet}">
      <span class="swatch" style="background:${color}"></span>${fleet}
    </div>`).join('');
  els.fleetLegend.querySelectorAll('.legend-item').forEach(el => {
    el.addEventListener('click', () => {
      const f = el.dataset.fleet;
      hiddenFleets.has(f) ? hiddenFleets.delete(f) : hiddenFleets.add(f);
      renderLegend();
      renderChart(currentCity);
    });
  });
}

function toAxis(t) {
  // True modulo (not a one-directional while-loop) so this is correct even
  // for raw values well past 1440 -- which happens for waypoint-split pieces
  // carved out of an RON claim, since RON `end` values are next-day-dep+1440
  // to begin with. See the "gate_out clipping" note in the writeup.
  return (((t - 180) % 1440) + 1440) % 1440;
}
function fmtTime(mins) {
  const m = ((Math.round(mins) % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
}

// "G4" / "S2" -- short code for a gate/stand row, used both for the corner
// movement annotations and the tooltip's second line.
function shortLoc(loc) {
  return (loc.rowType === 'gate' ? 'G' : 'S') + loc.row;
}

// Builds the tooltip's second line. Falls back to the old plain kind label
// when a claim predates arrivalCity/departureCity (older JSON exports),
// so this stays backward-compatible without any version flag in the data.
function tooltipLine2(claim) {
  const hasNewFields = ('arrivalCity' in claim) || ('departureCity' in claim);
  if (!hasNewFields) {
    return {turn:'Turn', ron:'Overnight (RON)', terminate_only:'Terminate only', originate_only:'Originate only'}[claim.kind] || claim.kind;
  }
  const standInvolved = claim.rowType === 'stand'
    || (claim.moveFrom && claim.moveFrom.rowType === 'stand')
    || (claim.moveTo && claim.moveTo.rowType === 'stand');
  const kindWord = claim.kind === 'turn' ? (standInvolved ? 'ROD' : 'Turn') : 'RON';
  const left = claim.moveFrom ? shortLoc(claim.moveFrom) : claim.arrivalCity;
  const right = claim.moveTo ? shortLoc(claim.moveTo) : claim.departureCity;
  const parts = [];
  if (left) parts.push(left);
  parts.push(kindWord);
  if (right) parts.push(right);
  return parts.join(' • ');
}

function renderChart(city) {
  const nRows = city.nGates + city.nStands;
  const totalHUnits = AXIS_H + nRows * ROW_H;
  const vbWidth = MINUTES + CHART_MARGIN * 2;
  const colors = currentSchedule.fleetColors;

  // Fit-to-width: at scale=1 the full day exactly fills the visible timeline
  // column (no horizontal scroll needed); scale>1 zooms in past that.
  const containerWidth = els.chartScroll.clientWidth || 900;
  const fitScale = containerWidth / vbWidth;
  const renderScale = fitScale * scale;
  const chartPxW = vbWidth * renderScale;
  const totalPxH = totalHUnits * renderScale;

  // ---- frozen label column (same vertical scale as the chart, so rows line up) ----
  let labelSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${LABEL_W} ${totalHUnits}" width="${LABEL_W * renderScale}" height="${totalPxH}">`;
  for (let i = 0; i < nRows; i++) {
    const y = AXIS_H + i * ROW_H;
    const isStand = i >= city.nGates;
    const label = isStand ? `Stand ${i - city.nGates + 1}` : `Gate ${i + 1}`;
    if (i % 2 === 1) labelSvg += `<rect x="0" y="${y}" width="${LABEL_W}" height="${ROW_H}" fill="#000000" fill-opacity="0.025"/>`;
    labelSvg += `<line class="row-line" x1="0" y1="${y+ROW_H}" x2="${LABEL_W}" y2="${y+ROW_H}"/>`;
    labelSvg += `<text class="row-label" x="${LABEL_W-8}" y="${y+ROW_H/2}" font-size="11" text-anchor="end">${label}</text>`;
  }
  if (city.nStands > 0) {
    const dy = AXIS_H + city.nGates * ROW_H;
    labelSvg += `<line class="divider" x1="0" y1="${dy}" x2="${LABEL_W}" y2="${dy}"/>`;
  }
  labelSvg += `</svg>`;
  els.chartLabels.innerHTML = labelSvg;
  els.chartLabels.style.width = (LABEL_W * renderScale) + 'px';

  // ---- timeline (horizontally scrollable/zoomable) ----
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vbWidth} ${totalHUnits}" width="${chartPxW}" height="${totalPxH}">`;

  for (let m = 0; m <= MINUTES; m += 60) {
    const hour = Math.floor(((m + 180) % 1440) / 60);
    const x = CHART_MARGIN + m;
    svg += `<line class="grid-line" x1="${x}" y1="${AXIS_H}" x2="${x}" y2="${totalHUnits}"/>`;
    svg += `<text class="tick-label" x="${x}" y="${AXIS_H-11}" font-size="11">${String(hour).padStart(2,'0')}:00</text>`;
  }

  for (let i = 0; i < nRows; i++) {
    const y = AXIS_H + i * ROW_H;
    if (i % 2 === 1) svg += `<rect x="${CHART_MARGIN}" y="${y}" width="${MINUTES}" height="${ROW_H}" fill="#000000" fill-opacity="0.025"/>`;
    svg += `<line class="row-line" x1="${CHART_MARGIN}" y1="${y+ROW_H}" x2="${CHART_MARGIN+MINUTES}" y2="${y+ROW_H}"/>`;
  }
  if (city.nStands > 0) {
    const dy = AXIS_H + city.nGates * ROW_H;
    svg += `<line class="divider" x1="${CHART_MARGIN}" y1="${dy}" x2="${CHART_MARGIN+MINUTES}" y2="${dy}"/>`;
  }

  const claimsJson = [];
  for (const claim of city.claims) {
    if (hiddenFleets.has(claim.fleet)) continue;
    const rowIdx = claim.rowType === 'gate' ? claim.row - 1 : city.nGates + claim.row - 1;
    const y = AXIS_H + rowIdx * ROW_H;
    let x0 = toAxis(claim.start), x1 = toAxis(claim.end);
    if (x1 <= x0) x1 += MINUTES;
    const segments = x1 > MINUTES ? [[x0, MINUTES],[0, x1 - MINUTES]] : [[x0, x1]];
    const color = colors[claim.fleet] || '#999';
    const cid = claimsJson.length;
    claimsJson.push(claim);

    segments.forEach(([sx0, sx1]) => {
      const w = Math.max(sx1 - sx0, 0.5);
      svg += `<rect class="claim-rect" data-cid="${cid}" x="${CHART_MARGIN+sx0}" y="${y+3}" width="${w}" height="${ROW_H-6}" rx="2" fill="${color}"/>`;
    });
    const widest = segments.reduce((a,b) => (b[1]-b[0] > a[1]-a[0] ? b : a));
    if (widest[1] - widest[0] > 26) {
      const cx = CHART_MARGIN + widest[0] + (widest[1]-widest[0])/2;
      svg += `<text class="claim-label" x="${cx}" y="${y+ROW_H/2}" font-size="11">${escapeHtml(claim.label)}</text>`;
    }
    // Gate/stand movement corners (waypoint-split pieces only -- absent on
    // everything else, and on any claim from an older JSON that predates
    // this field). moveFrom = where this piece's aircraft physically came
    // from a moment ago; moveTo = where it heads next.
    const firstSeg = segments[0], lastSeg = segments[segments.length-1];
    if (claim.moveFrom && (firstSeg[1]-firstSeg[0]) > 18) {
      svg += `<text class="claim-corner" x="${CHART_MARGIN+firstSeg[0]+4}" y="${y+9}" font-size="8.5" text-anchor="start">${escapeHtml(shortLoc(claim.moveFrom))}</text>`;
    }
    if (claim.moveTo && (lastSeg[1]-lastSeg[0]) > 18) {
      svg += `<text class="claim-corner" x="${CHART_MARGIN+lastSeg[1]-4}" y="${y+ROW_H-6}" font-size="8.5" text-anchor="end">${escapeHtml(shortLoc(claim.moveTo))}</text>`;
    }
  }

  svg += `</svg>`;
  els.chartScroll.innerHTML = svg;
  attachChartInteractions(claimsJson);
}

function attachChartInteractions(claimsJson) {
  const svgEl = els.chartScroll.querySelector('svg');

  // tooltip on hover (desktop) / tap (touch)
  svgEl.querySelectorAll('.claim-rect').forEach(rect => {
    const claim = claimsJson[+rect.dataset.cid];
    const show = (evt) => {
      els.tooltip.innerHTML = `<b>${escapeHtml(claim.label)}</b> · ${claim.fleet}<br>${escapeHtml(tooltipLine2(claim))}<br>${fmtTime(claim.start)} → ${fmtTime(claim.end)}`;
      els.tooltip.style.display = 'block';
      positionTooltip(evt);
    };
    rect.addEventListener('mouseenter', show);
    rect.addEventListener('mousemove', positionTooltip);
    rect.addEventListener('mouseleave', () => els.tooltip.style.display = 'none');
    rect.addEventListener('click', (evt) => { evt.stopPropagation(); show(evt); });
  });
  document.addEventListener('click', () => { els.tooltip.style.display = 'none'; }, {once:false});

  // drag-to-pan (mouse): horizontal only -- chart-scroll is the only thing
  // that still scrolls internally now that the chart's height always fits
  // its content; vertical movement is just normal page scroll.
  let dragging = false, startX, startLeft;
  els.chartScroll.addEventListener('mousedown', (e) => {
    dragging = true; startX = e.clientX;
    startLeft = els.chartScroll.scrollLeft;
    els.chartScroll.classList.add('grabbing');
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    els.chartScroll.scrollLeft = startLeft - (e.clientX - startX);
  });
  window.addEventListener('mouseup', () => { dragging = false; els.chartScroll.classList.remove('grabbing'); });
}

function positionTooltip(evt) {
  const pad = 14;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + 220 > window.innerWidth) x = evt.clientX - 220;
  if (y + 80 > window.innerHeight) y = evt.clientY - 80;
  els.tooltip.style.left = x + 'px';
  els.tooltip.style.top = y + 'px';
}

function setZoom(newScale) {
  const clamped = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
  const hScroller = els.chartScroll;
  const cx = hScroller.clientWidth / 2;   // zoom buttons anchor on the horizontal center of what's visible
  const ratioX = (hScroller.scrollLeft + cx) / (hScroller.scrollWidth || 1);
  scale = clamped;
  if (currentCity) renderChart(currentCity);
  hScroller.scrollLeft = ratioX * hScroller.scrollWidth - cx;
  els.zoomReset.textContent = Math.round(scale*100) + '%';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

init();
</script>
</body>
</html>
